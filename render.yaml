services:
  - type: web
    name: recipemate-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/settings
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
